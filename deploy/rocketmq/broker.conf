brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：Broker 会把 brokerIP1 广告给客户端，客户端据此回连。
# 如果留 127.0.0.1，后端容器会去连自己的 localhost 而失败。
# 这里固定为 compose 中给 broker 分配的静态容器 IP。
brokerIP1 = 172.28.0.5
listenPort = 10911

# 允许自动创建 Topic，省去手工建 topic（生产环境建议关闭并预先创建）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 单机/演示环境：commitlog 单文件调小（默认 1G），降低内存与磁盘占用
mapedFileSizeCommitLog = 268435456
sendMessageThreadPoolNums = 2
