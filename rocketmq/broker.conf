# ============================================================
# Echo 项目 RocketMQ Broker 配置
# 启动方式：
#   set ROCKETMQ_HOME=D:\study\rocketmq-5.3.4
#   %ROCKETMQ_HOME%\bin\mqbroker.cmd -c D:\echo\启动\rocketmq\broker.conf
#
# 相对默认配置的调整：
#   1. storePathRootDir / storePathCommitLog 指到 RocketMQ 安装目录，
#      存储位置与运行账号的用户目录解耦，换账号运行行为一致
#   2. autoCreateTopicEnable / autoCreateSubscriptionGroup 显式开启，
#      生产端与消费端首次连接时自动建 Topic 与消费组
# ============================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

namesrvAddr = 127.0.0.1:9876
listenPort = 10911

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 存储路径：相对 RocketMQ 安装目录，按本机实际情况修改
storePathRootDir = ./store
storePathCommitLog = ./store/commitlog
