# 测试环境默认配置
# 注意：此文件对所有 @SpringBootTest 测试生效
# 如需使用真实中间件，请使用 @ActiveProfiles("integration")

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: echo-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 不再全局排除 RocketMQ（集成测试需要）
# 如果单元测试不需要 MQ，请在具体测试类中使用 @MockBean
