# ============================================================
# 回响 Echo —— 一键部署编排
#
#   docker compose up -d --build      构建并启动全套
#   docker compose ps                 看状态
#   docker compose logs -f backend    跟后端日志
#   docker compose down               停止（数据保留）
#   docker compose down -v            停止并清空数据库
#
# 端口故意避开你本机已经在跑的那套（3306/6379/9876/8081）：
#   管理端     http://localhost:3001
#   用户端     http://localhost:3002
#   后端 API   http://localhost:8089
# ============================================================
name: echo

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    container_name: echo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: echo
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=512M
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表 + 灌数据（取自本地 echo 库的 dump）
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - echo-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: echo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - echo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    build:
      context: ./deploy/rocketmq
      dockerfile: Dockerfile
    image: echo/rocketmq:5.3.1
    container_name: echo-mq-namesrv
    restart: unless-stopped
    command: bash /opt/rocketmq/bin/mqnamesrv
    environment:
      TZ: Asia/Shanghai
    networks:
      - echo-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rocketmq-broker:
    image: echo/rocketmq:5.3.1
    container_name: echo-mq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: bash /opt/rocketmq/bin/mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks:
      echo-net:
        # broker.conf 里的 brokerIP1 必须与这个地址一致
        ipv4_address: 172.28.0.5

  # ==================== 应用层 ====================
  backend:
    build:
      context: ./echo
      dockerfile: Dockerfile
    image: echo/backend:latest
    container_name: echo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      ECHO_IMAGE_ROOT: /data/imgs
      # 管理员引导通道令牌，留空即关闭；仅在需要重置超管密码时临时设置
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8089}:8081"
    volumes:
      # 后台上传的图片持久化到宿主机
      - ./deploy/imgs:/data/imgs
    networks:
      - echo-net

  admin-web:
    build:
      context: .
      dockerfile: deploy/admin.Dockerfile
    image: echo/admin-web:latest
    container_name: echo-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - echo-net

  user-web:
    build:
      context: .
      dockerfile: deploy/user.Dockerfile
    image: echo/user-web:latest
    container_name: echo-user-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${USER_PORT:-3002}:80"
    networks:
      - echo-net

networks:
  echo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
